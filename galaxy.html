<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galaxy 星河线 | Web Effect Lab</title>
  <meta name="description" content="流动星河线、五角星点缀和鼠标牵引的 Canvas 动画展示。">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070a12;
      --panel: rgba(12,16,28,.72);
      --text: #f7f2e8;
      --muted: #aab6c5;
      --line: rgba(255,255,255,.14);
      --gold: #f4c15d;
      --sky: #7db7ff;
      --green: #4fd0b0;
      --coral: #ef6b62;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 20%, rgba(125,183,255,.18), transparent 32%),
        radial-gradient(circle at 78% 72%, rgba(79,208,176,.12), transparent 30%),
        var(--bg);
    }

    #galaxyCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      background: #070a12;
    }

    .nav {
      position: fixed;
      z-index: 4;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1120px, calc(100% - 32px));
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(7,10,18,.66);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 850;
    }

    .mark {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: conic-gradient(from 130deg, var(--sky), var(--gold), var(--green), var(--coral), var(--sky));
      box-shadow: 0 0 24px rgba(125,183,255,.32);
    }

    .nav a,
    .btn {
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.06);
      border-radius: 8px;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 13px;
      cursor: pointer;
    }

    .nav a:hover,
    .btn:hover { background: rgba(255,255,255,.12); }

    .hero {
      position: relative;
      z-index: 2;
      width: min(1120px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, .9fr) minmax(280px, .55fr);
      gap: 28px;
      align-items: end;
      padding: 116px 0 44px;
      pointer-events: none;
    }

    .intro,
    .panel {
      pointer-events: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 70px rgba(0,0,0,.34);
    }

    .intro { padding: 24px; }
    .panel { padding: 18px; }

    .eyebrow {
      color: var(--gold);
      font-size: 14px;
      font-weight: 760;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 88px);
      line-height: .95;
      letter-spacing: 0;
    }

    p {
      margin: 16px 0 0;
      color: var(--muted);
      line-height: 1.75;
      font-size: 16px;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .btn.primary {
      background: var(--gold);
      color: #10100a;
      border-color: transparent;
      font-weight: 850;
    }

    .stats {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding-bottom: 10px;
    }

    .stat strong { color: var(--text); }

    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; align-items: end; }
      .nav { width: min(100% - 20px, 1120px); }
      .nav a:nth-of-type(2) { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="galaxyCanvas"></canvas>

  <nav class="nav" aria-label="主导航">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>Galaxy 星河线</span></div>
    <div>
      <a href="effects.html#works">返回展厅</a>
      <a href="index.html">主页</a>
    </div>
  </nav>

  <main class="hero">
    <section class="intro">
      <div class="eyebrow">Canvas animation · star river line</div>
      <h1>星河线与五角星的流动轨迹。</h1>
      <p>星点沿弧形银河带持续流动，五角星闪烁旋转。移动鼠标会轻微牵引线带，点击画面会生成一组新的星芒。</p>
      <div class="tools">
        <button class="btn primary" type="button" id="burstStars">生成星芒</button>
        <button class="btn" type="button" id="toggleMotion">暂停动画</button>
      </div>
    </section>

    <aside class="panel">
      <strong>效果参数</strong>
      <div class="stats">
        <div class="stat"><span>星点</span><strong id="starCount">0</strong></div>
        <div class="stat"><span>五角星</span><strong>闪烁 / 旋转</strong></div>
        <div class="stat"><span>交互</span><strong>鼠标牵引</strong></div>
        <div class="stat"><span>点击</span><strong>星芒扩散</strong></div>
      </div>
    </aside>
  </main>

  <script>
    const canvas = document.querySelector("#galaxyCanvas");
    const ctx = canvas.getContext("2d");
    const burstButton = document.querySelector("#burstStars");
    const toggleButton = document.querySelector("#toggleMotion");
    const starCount = document.querySelector("#starCount");

    let width = 0;
    let height = 0;
    let time = 0;
    let paused = false;
    let stars = [];
    let sparks = [];
    let pointer = { x: .5, y: .45, active: false };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      createStars();
    }

    function createStars() {
      const count = Math.max(150, Math.floor((width * height) / 6200));
      stars = Array.from({ length: count }, (_, index) => ({
        offset: index / count,
        lane: index % 7,
        speed: .00055 + (index % 9) * .00012,
        size: 1 + (index % 5) * .46,
        spin: index * .61,
        color: ["#f7f2e8", "#f4c15d", "#7db7ff", "#4fd0b0", "#ef6b62"][index % 5],
        star: index % 10 === 0
      }));
      starCount.textContent = count;
    }

    function pointOnGalaxy(t, lane = 0) {
      const x = width * (.04 + t * .92);
      const arc = Math.sin((t - .08) * Math.PI) * height * .34;
      const wave = Math.sin(t * Math.PI * 5 + time * .65) * 18;
      const pullX = pointer.active ? (pointer.x - .5) * 72 * Math.sin(t * Math.PI) : 0;
      const pullY = pointer.active ? (pointer.y - .45) * 70 * Math.sin(t * Math.PI) : 0;
      return {
        x: x + pullX,
        y: height * .66 - arc + lane + wave + pullY
      };
    }

    function drawStar(x, y, outer, inner, rotation, color, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const radius = i % 2 === 0 ? outer : inner;
        const angle = -Math.PI / 2 + i * Math.PI / 5;
        const px = Math.cos(angle) * radius;
        const py = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    function addSparkBurst(x = width * .5, y = height * .42) {
      for (let i = 0; i < 36; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 4.2;
        sparks.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          color: ["#f7f2e8", "#f4c15d", "#7db7ff", "#4fd0b0"][i % 4]
        });
      }
    }

    function drawBackground() {
      const bg = ctx.createLinearGradient(0, 0, 0, height);
      bg.addColorStop(0, "#070a12");
      bg.addColorStop(.5, "#0d1224");
      bg.addColorStop(1, "#06070c");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, width, height);

      const glow = ctx.createRadialGradient(width * .5, height * .38, 10, width * .5, height * .38, Math.max(width, height) * .7);
      glow.addColorStop(0, "rgba(125,183,255,.2)");
      glow.addColorStop(.34, "rgba(79,208,176,.08)");
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);
    }

    function drawGalaxyLines() {
      for (let band = 0; band < 13; band++) {
        const lane = (band - 6) * 9;
        ctx.beginPath();
        for (let i = 0; i <= 180; i++) {
          const t = i / 180;
          const p = pointOnGalaxy(t, lane + Math.sin(t * Math.PI * 2 + band) * 11);
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }
        ctx.strokeStyle = band % 3 === 0 ? "rgba(247,242,232,.24)" : band % 3 === 1 ? "rgba(125,183,255,.18)" : "rgba(79,208,176,.15)";
        ctx.lineWidth = Math.max(.7, 4.4 - Math.abs(band - 6) * .42);
        ctx.stroke();
      }
    }

    function drawStars() {
      stars.forEach((star, index) => {
        if (!paused) star.offset = (star.offset + star.speed) % 1;
        const lane = (star.lane - 3) * 18 + Math.sin(time + index) * 8;
        const p = pointOnGalaxy(star.offset, lane);
        const alpha = Math.max(.24, .5 + Math.sin(time * 3 + star.spin) * .3);
        if (star.star) {
          ctx.shadowColor = star.color;
          ctx.shadowBlur = 16;
          drawStar(p.x, p.y, 8 + star.size * 1.8, 3.5 + star.size, time * .8 + index, star.color, alpha);
          ctx.shadowBlur = 0;
        } else {
          ctx.globalAlpha = alpha;
          ctx.fillStyle = star.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, star.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      });

      for (let i = 0; i < 13; i++) {
        const t = (i / 12 + time * .028) % 1;
        const p = pointOnGalaxy(t, Math.sin(i) * 34);
        drawStar(p.x, p.y, 13 + Math.sin(time * 2 + i) * 2.5, 5.4, time * .7 + i, i % 2 ? "#f4c15d" : "#7db7ff", .8);
      }
    }

    function drawSparks() {
      sparks.forEach((spark) => {
        spark.x += spark.vx;
        spark.y += spark.vy;
        spark.vy += .012;
        spark.life -= .014;
        ctx.globalAlpha = Math.max(0, spark.life);
        drawStar(spark.x, spark.y, 7 * spark.life, 3 * spark.life, time * 2, spark.color, spark.life);
      });
      ctx.globalAlpha = 1;
      sparks = sparks.filter((spark) => spark.life > 0);
    }

    function frame() {
      if (!paused) time += .016;
      drawBackground();
      drawGalaxyLines();
      drawStars();
      drawSparks();
      requestAnimationFrame(frame);
    }

    canvas.addEventListener("pointermove", (event) => {
      pointer = { x: event.clientX / width, y: event.clientY / height, active: true };
    });

    canvas.addEventListener("pointerleave", () => { pointer.active = false; });
    canvas.addEventListener("click", (event) => addSparkBurst(event.clientX, event.clientY));
    burstButton.addEventListener("click", () => addSparkBurst());
    toggleButton.addEventListener("click", () => {
      paused = !paused;
      toggleButton.textContent = paused ? "继续动画" : "暂停动画";
    });

    window.addEventListener("resize", resize);
    resize();
    addSparkBurst();
    frame();
  </script>
</body>
</html>
